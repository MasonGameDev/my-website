
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Website Community Voting</title>

        <link rel="stylesheet" href="../css/mainPagesStyling.css">
    </head>

    <body>
        <header>
            <h1>Website Community Voting</h1>

            <nav>
                <ul>
                    <li><a href="../index.html">Home Page</a></li>
                    <li><a href="bio.html">Bio</a></li>
                    <li><a href="roadmap.html">Roadmap</a></li>
                    <li><a href="voting.html">Voting</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section id="dailyVoting">
                <h2>Daily Community Poll</h2>

                <div id="pollContainer">

                    <h3 id="pollQuestion"></h3>

                    <div id="pollOptions">
                        <!-- Voting options generated by JavaScript -->
                    </div>

                    <button id="submitVote">
                        Submit Vote
                    </button>

                    <p id="voteMessage"></p>

                </div>
            </section>

            <section id="pollResults">
                <h2>Previous Poll Results</h2>

                <div id="resultsContainer">
                    <!-- Previous poll results generated by JavaScript -->
                </div>
            </section>
        </main>

        <script src="../js/voting.js"></script>
    </body>
</html>
